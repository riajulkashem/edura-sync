name: Build Windows Installer

on:
  push:
    branches: [ main, headless ]
  pull_request:
    branches: [ main, headless ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.2'
          cache: 'pip'

      - name: Clear pip cache
        run: |
          pip cache purge

      - name: Install Inno Setup
        run: |
          choco install innosetup --version=6.2.2 --force -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install peewee explicitly first (sometimes needed for dependencies)
          pip install peewee==3.17.9
          # Install all requirements
          pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Failed to install requirements.txt"
            Write-Host "Attempting to install packages individually..."
            pip install certifi cffi charset-normalizer click cryptography idna loguru notify_py peewee-migrate playhouse PySide6 pyzk requests tzlocal urllib3 pywin32
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          # Install additional build dependencies
          pip install pyinstaller pillow
          # Verify critical packages are installed
          Write-Host "Verifying installed packages..."
          python -c "import peewee; print(f'✓ peewee version: {peewee.__version__}'); print(f'✓ peewee path: {peewee.__file__}')"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: peewee not installed! Checking installed packages..."
            pip list | Select-String "peewee"
            pip show peewee
            Write-Host "Installed packages containing 'peewee':"
            pip list | findstr /i "peewee"
            exit 1
          }
          python -c "import PySide6; print(f'✓ PySide6 version: {PySide6.__version__}')"
          python -c "import zk; print('✓ zk library installed')"
          Write-Host "All critical packages verified successfully"

      - name: Create version file
        run: |
          $buildNum = "${{ github.run_number }}"
          $version = "1.0.$buildNum"
          # Set file suffix based on branch (empty for main, -headless for headless branch)
          if ("${{ github.ref }}" -eq "refs/heads/headless") {
            $fileSuffix = "-headless"
          } else {
            $fileSuffix = ""
          }
          echo "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "FILE_SUFFIX=$fileSuffix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "version = '$version'" | Out-File -FilePath ./core/version.py -Encoding utf8

      - name: Build with PyInstaller
        run: |
          # Verify peewee can be imported before building
          python -c "import peewee; print('peewee imported successfully')"
          
          # Use --collect-all and --collect-submodules to ensure all dependencies are included
          pyinstaller --clean --noconfirm --collect-all peewee --collect-all PySide6 --collect-submodules peewee --collect-submodules playhouse edurasync.spec
          if ($LASTEXITCODE -ne 0) {
            Write-Host "PyInstaller failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          
          # Verify peewee is in the build
          Write-Host "Checking if peewee is in the build..."
          if (Test-Path "dist\EduraSync\_internal\peewee") {
            Write-Host "✓ peewee directory found in build"
            Get-ChildItem "dist\EduraSync\_internal\peewee" | Select-Object -First 5 Name
          } else {
            Write-Host "✗ WARNING: peewee directory NOT found in build"
            Write-Host "Contents of _internal:"
            Get-ChildItem "dist\EduraSync\_internal" | Where-Object { $_.Name -like "*peewee*" -or $_.Name -like "*playhouse*" } | Select-Object Name
          }

      - name: Create credits file
        run: |
          echo "PrimeSync - Attendance Synchronization System" | Out-File -FilePath CREDITS.txt -Encoding utf8
          echo "Developed by Riajul Kashem, Software Engineer" | Out-File -FilePath CREDITS.txt -Append -Encoding utf8

      - name: Create Inno Setup installer
        run: |
          $innoScript = @"
          #define MyAppName "EduraSync"
          #define MyAppVersion "${{ env.APP_VERSION }}"
          #define MyAppPublisher "Riajul Kashem"
          #define MyAppExeName "EduraSync.exe"
          
          [Setup]
          AppId={{EA3FCF1E-0EB9-4DEA-AB7A-ADE3D2B7AAF8}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\{#MyAppName}
          OutputDir=installer
          OutputBaseFilename={#MyAppName}-Setup-{#MyAppVersion}
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          
          [Files]
          Source: "dist\EduraSync\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          
          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon
          
          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked
          
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent
          "@
          
          $innoScript | Out-File -FilePath ./installer.iss -Encoding utf8
          
          # Create placeholder files if missing to prevent Inno Setup errors
          if (-not (Test-Path LICENSE)) { "MIT License" | Out-File -FilePath LICENSE }
          if (-not (Test-Path README.md)) { "# EduraSync" | Out-File -FilePath README.md }
          
          # Run Inno Setup compiler
          mkdir -Force installer
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss

      - name: Generate Checksum
        shell: pwsh
        run: |
          $installerPath = "installer/EduraSync-Setup-${{ env.APP_VERSION }}.exe"
          if (Test-Path $installerPath) {
            $hash = (Get-FileHash $installerPath -Algorithm SHA256).Hash
            echo "SHA256: $hash"
            $hash | Out-File -FilePath "$installerPath.sha256"
            Write-Host "Checksum generated at $installerPath.sha256"
          } else {
            Write-Host "Installer not found, skipping checksum."
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduraSync-Windows-Installer
          path: |
            installer/EduraSync-Setup-${{ env.APP_VERSION }}.exe
            installer/EduraSync-Setup-${{ env.APP_VERSION }}.exe.sha256

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: EduraSync v${{ env.APP_VERSION }}
          tag_name: v${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          files: |
            installer/EduraSync-Setup-${{ env.APP_VERSION }}.exe
            installer/EduraSync-Setup-${{ env.APP_VERSION }}.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Public Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/headless')
        uses: softprops/action-gh-release@v2
        with:
          # Point this to your public repository for downloads
          repository: riajulkashem/edura-sync
          name: EduraSync v${{ env.APP_VERSION }}${{ env.FILE_SUFFIX }}
          tag_name: v${{ env.APP_VERSION }}${{ env.FILE_SUFFIX }}
          draft: false
          prerelease: false
          files: |
            installer/*.exe
            installer/*.sha256
        env:
          # Use the PAT that has access to the public repo
          # Create this secret in your repository settings: Settings > Secrets and variables > Actions
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}