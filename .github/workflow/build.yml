name: Build PrimeSync Tray App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Build with PyInstaller
      run: pyinstaller --noconfirm --clean primesync.spec
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v3
      with:
        name: PrimeSyncTrayApp-Windows
        path: dist/PrimeSyncTrayApp/

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Build with PyInstaller
      run: pyinstaller --noconfirm --clean primesync.spec
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v3
      with:
        name: PrimeSyncTrayApp-macOS
        path: dist/PrimeSyncTrayApp.app